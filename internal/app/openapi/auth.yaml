paths:
  /auth/login:
    post:
      tags: [认证]
      summary: 用户登录
      operationId: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            00000 成功，返回 access_token 和 refresh_token
            特有错误：A01103 账号或密码错误
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/LoginResponse'

  /auth/fetch-access-token:
    post:
      tags: [认证]
      summary: 刷新 AccessToken
      operationId: FetchAccessToken
      security:
        - RefreshTokenAuth: []
      responses:
        '200':
          description: |
            00000 成功，返回新的 access_token
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/TokenResponse'

  /auth/fetch-refresh-token:
    post:
      tags: [认证]
      summary: 刷新 RefreshToken
      operationId: FetchRefreshToken
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: |
            00000 成功，返回新的 refresh_token
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/TokenResponse'

  /auth/logout:
    post:
      tags: [认证]
      summary: 退出登录
      operationId: Logout
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: |
            00000 退出成功
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ApiResponse'

components:
  schemas:
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    TokenResponse:
      allOf:
        - $ref: '../openapi.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 32

    LoginResponse:
      allOf:
        - $ref: '../openapi.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '../openapi.yaml#/components/schemas/TokenPair'
