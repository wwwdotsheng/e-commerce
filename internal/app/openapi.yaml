openapi: "3.1.0"
info:
  title: E-Commerce API
  description: |
    电商后端 API，支持用户认证、商品管理、钱包充值、订单管理、优惠券。

    ## 通用错误码

    所有接口都可能返回以下错误：

    - B01001 系统繁忙
    - A00101 参数错误

    需要鉴权的接口还可能返回：
    - A02103 token 无效
    - A02101 token 已过期
    - A02102 账号已在别处登录
    - A02100 无权限访问（账号类型或状态不允许调用该接口）

    每个接口特有的业务码在对应接口的 description 中列出。
  version: "1.0"
servers:
  - url: http://localhost:10000/api/v1
    description: Local dev

paths:
  /auth/login:
    $ref: './openapi/auth.yaml#/paths/~1auth~1login'
  /auth/fetch-access-token:
    $ref: './openapi/auth.yaml#/paths/~1auth~1fetch-access-token'
  /auth/fetch-refresh-token:
    $ref: './openapi/auth.yaml#/paths/~1auth~1fetch-refresh-token'
  /auth/logout:
    $ref: './openapi/auth.yaml#/paths/~1auth~1logout'
  /user/register:
    $ref: './openapi/user.yaml#/paths/~1user~1register'
  /wallet/deposit:
    $ref: './openapi/wallet.yaml#/paths/~1wallet~1deposit'
  /product/create:
    $ref: './openapi/product.yaml#/paths/~1product~1create'
  /product/list:
    $ref: './openapi/product.yaml#/paths/~1product~1list'
  /product/search:
    $ref: './openapi/product.yaml#/paths/~1product~1search'
  /product/{id}:
    $ref: './openapi/product.yaml#/paths/~1product~1%7Bid%7D'
  /product/{id}/status:
    $ref: './openapi/product.yaml#/paths/~1product~1%7Bid%7D~1status'
  /order/create:
    $ref: './openapi/order.yaml#/paths/~1order~1create'
  /order/list:
    $ref: './openapi/order.yaml#/paths/~1order~1list'
  /order/{id}:
    $ref: './openapi/order.yaml#/paths/~1order~1%7Bid%7D'
  /order/{id}/pay:
    $ref: './openapi/order.yaml#/paths/~1order~1%7Bid%7D~1pay'
  /order/{id}/refund:
    $ref: './openapi/order.yaml#/paths/~1order~1%7Bid%7D~1refund'
  /coupon/template:
    $ref: './openapi/coupon.yaml#/paths/~1coupon~1template'
  /coupon/grant:
    $ref: './openapi/coupon.yaml#/paths/~1coupon~1grant'
  /coupon/list:
    $ref: './openapi/coupon.yaml#/paths/~1coupon~1list'
  /shop/create:
    $ref: './openapi/shop.yaml#/paths/~1shop~1create'
  /shop/list:
    $ref: './openapi/shop.yaml#/paths/~1shop~1list'
  /shop/{id}:
    $ref: './openapi/shop.yaml#/paths/~1shop~1%7Bid%7D'

components:
  securitySchemes:
    AccessTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 粘贴登录返回的 access_token 原值，不要添加 Bearer 前缀
    RefreshTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 粘贴登录返回的 refresh_token 原值，不要添加 Bearer 前缀

  schemas:
    ApiResponse:
      $ref: './openapi/common.yaml#/components/schemas/ApiResponse'
    TokenPair:
      $ref: './openapi/auth.yaml#/components/schemas/TokenPair'
    TokenResponse:
      $ref: './openapi/auth.yaml#/components/schemas/TokenResponse'
    LoginRequest:
      $ref: './openapi/auth.yaml#/components/schemas/LoginRequest'
    LoginResponse:
      $ref: './openapi/auth.yaml#/components/schemas/LoginResponse'
    RegisterRequest:
      $ref: './openapi/user.yaml#/components/schemas/RegisterRequest'
    DepositRequest:
      $ref: './openapi/wallet.yaml#/components/schemas/DepositRequest'
    CreateProductRequest:
      $ref: './openapi/product.yaml#/components/schemas/CreateProductRequest'
    CreateShopRequest:
      $ref: './openapi/shop.yaml#/components/schemas/CreateShopRequest'
    ShopItem:
      $ref: './openapi/shop.yaml#/components/schemas/ShopItem'
    ShopResponse:
      $ref: './openapi/shop.yaml#/components/schemas/ShopResponse'
    ShopListResponse:
      $ref: './openapi/shop.yaml#/components/schemas/ShopListResponse'
    UpdateProductPropertyRequest:
      $ref: './openapi/product.yaml#/components/schemas/UpdateProductPropertyRequest'
    UpdateProductStatusRequest:
      $ref: './openapi/product.yaml#/components/schemas/UpdateProductStatusRequest'
    ProductItem:
      $ref: './openapi/product.yaml#/components/schemas/ProductItem'
    ProductDetail:
      $ref: './openapi/product.yaml#/components/schemas/ProductDetail'
    ProductListResponse:
      $ref: './openapi/product.yaml#/components/schemas/ProductListResponse'
    ProductDetailResponse:
      $ref: './openapi/product.yaml#/components/schemas/ProductDetailResponse'
    CreateOrderRequest:
      $ref: './openapi/order.yaml#/components/schemas/CreateOrderRequest'
    OrderItem:
      $ref: './openapi/order.yaml#/components/schemas/OrderItem'
    OrderListResponse:
      $ref: './openapi/order.yaml#/components/schemas/OrderListResponse'
    OrderDetailResponse:
      $ref: './openapi/order.yaml#/components/schemas/OrderDetailResponse'
    TimelineEvent:
      $ref: './openapi/order.yaml#/components/schemas/TimelineEvent'
    RefundDetail:
      $ref: './openapi/order.yaml#/components/schemas/RefundDetail'
    RefundResponse:
      $ref: './openapi/order.yaml#/components/schemas/RefundResponse'
    CreateTemplateRequest:
      $ref: './openapi/coupon.yaml#/components/schemas/CreateTemplateRequest'
    TemplateItem:
      $ref: './openapi/coupon.yaml#/components/schemas/TemplateItem'
    TemplateResponse:
      $ref: './openapi/coupon.yaml#/components/schemas/TemplateResponse'
    GrantCouponRequest:
      $ref: './openapi/coupon.yaml#/components/schemas/GrantCouponRequest'
    UserCouponItem:
      $ref: './openapi/coupon.yaml#/components/schemas/UserCouponItem'
    UserCouponResponse:
      $ref: './openapi/coupon.yaml#/components/schemas/UserCouponResponse'
    UserCouponListResponse:
      $ref: './openapi/coupon.yaml#/components/schemas/UserCouponListResponse'
