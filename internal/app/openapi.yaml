openapi: "3.1.0"
info:
  title: E-Commerce API
  description: |
    电商后端 API，支持用户认证、商品管理、钱包充值、订单管理、优惠券。

    ## 通用错误码

    所有接口都可能返回以下错误：

    - B01001 系统繁忙
    - A00101 参数错误

    需要鉴权的接口还可能返回：
    - A02103 token 无效
    - A02101 token 已过期
    - A02102 账号已在别处登录

    每个接口特有的业务码在对应接口的 description 中列出。
  version: "1.0"
servers:
  - url: http://localhost:10000/api/v1
    description: Local dev

paths:
  /auth/login:
    post:
      tags: [认证]
      summary: 用户登录
      operationId: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            00000 成功，返回 access_token 和 refresh_token
            特有错误：A01103 账号或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/fetch-access-token:
    post:
      tags: [认证]
      summary: 刷新 AccessToken
      operationId: FetchAccessToken
      security:
        - RefreshTokenAuth: []
      responses:
        '200':
          description: |
            00000 成功，返回新的 access_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/fetch-refresh-token:
    post:
      tags: [认证]
      summary: 刷新 RefreshToken
      operationId: FetchRefreshToken
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: |
            00000 成功，返回新的 refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/logout:
    post:
      tags: [认证]
      summary: 退出登录
      operationId: Logout
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: |
            00000 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /user/register:
    post:
      tags: [用户]
      summary: 用户注册
      operationId: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: |
            00000 注册成功
            特有错误：A01102 用户名或邮箱已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /wallet/deposit:
    post:
      tags: [钱包]
      summary: 钱包充值
      operationId: Deposit
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '200':
          description: |
            00000 充值成功
            特有错误：A03101 充值金额非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /product/create:
    post:
      tags: [商品]
      summary: 创建商品
      operationId: CreateProduct
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: |
            00000 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /product/list:
    get:
      tags: [商品]
      summary: 商品列表
      operationId: ListProducts
      security:
        - AccessTokenAuth: []
      parameters:
        - name: page_num
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: |
            00000 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /product/search:
    get:
      tags: [商品]
      summary: 搜索商品
      operationId: SearchProducts
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: min_price
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: max_price
          in: query
          required: false
          schema:
            type: number
            format: float
        - name: page_num
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: shop_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /product/{id}:
    get:
      tags: [商品]
      summary: 商品详情
      operationId: GetProduct
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            00000 成功
            特有错误：A04102 商品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'

    patch:
      tags: [商品]
      summary: 更新商品属性
      operationId: UpdateProductProperty
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductPropertyRequest'
      responses:
        '200':
          description: |
            00000 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    delete:
      tags: [商品]
      summary: 删除商品
      operationId: DeleteProduct
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            00000 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /product/{id}/status:
    post:
      tags: [商品]
      summary: 更新商品状态
      operationId: UpdateProductStatus
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductStatusRequest'
      responses:
        '200':
          description: |
            00000 更新成功
            特有错误：A04103 商品状态参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /order/create:
    post:
      tags: [订单]
      summary: 创建订单
      operationId: CreateOrder
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: |
            00000 下单成功
            特有错误：A04101 库存不足、A05100 商品 ID 不存在
            注意：幂等键重复时不返回错误，视为成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /order/list:
    get:
      tags: [订单]
      summary: 订单列表
      operationId: ListOrders
      security:
        - AccessTokenAuth: []
      parameters:
        - name: page_num
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: |
            00000 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

  /order/{id}:
    get:
      tags: [订单]
      summary: 订单详情
      operationId: GetOrderByID
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功返回订单详情；订单不存在或不属于当前用户时返回 A00002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'

  /order/{id}/pay:
    post:
      tags: [订单]
      summary: 使用账户余额支付订单
      description: |
        买家为自己的待支付订单付款：在同一事务内扣减买家余额、记入商家余额，并把订单转为已支付。
        重复支付返回已有订单，不重复扣款；已关闭或超过支付截止时间的订单拒绝支付。
      operationId: PayOrder
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            000000 支付成功，或订单已支付时返回已有结果
            特有错误：A00002 订单不存在或不属于当前用户、A03102 余额不足
            A05102 订单当前状态不可支付、A05103 已超过支付截止时间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'

  /order/{id}/refund:
    post:
      tags: [订单]
      summary: 申请订单全额退款（接口占位）
      operationId: ApplyOrderRefund
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRefundRequest'
      responses:
        '200':
          description: 统一 API 响应；业务逻辑尚未实现
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /coupon/template:
    post:
      tags: [优惠券]
      summary: 创建优惠券模板
      operationId: CreateCouponTemplate
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '200':
          description: |
            00000 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'

  /coupon/grant:
    post:
      tags: [优惠券]
      summary: 给用户发券
      operationId: GrantCoupon
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCouponRequest'
      responses:
        '200':
          description: |
            00000 发券成功
            特有错误：券模板不存在、已过期、库存不足、超过每人限领数量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCouponResponse'

  /coupon/list:
    get:
      tags: [优惠券]
      summary: 查看我的优惠券
      operationId: ListUserCoupons
      security:
        - AccessTokenAuth: []
      parameters:
        - name: page_num
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: |
            00000 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCouponListResponse'

  /shop/create:
    post:
      tags: [店铺]
      summary: 创建店铺
      operationId: CreateShop
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShopRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopResponse'

  /shop/list:
    get:
      tags: [店铺]
      summary: 店铺列表
      operationId: ListShops
      security:
        - AccessTokenAuth: []
      parameters:
        - name: page_num
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: 店铺列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopListResponse'

  /shop/{id}:
    get:
      tags: [店铺]
      summary: 店铺详情
      operationId: GetShop
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 店铺详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopResponse'

components:
  securitySchemes:
    AccessTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 粘贴登录返回的 access_token 原值，不要添加 Bearer 前缀
    RefreshTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 粘贴登录返回的 refresh_token 原值，不要添加 Bearer 前缀

  schemas:
    ApiResponse:
      type: object
      required: [code, userMsg]
      properties:
        code:
          type: string
          description: 业务码
        userMsg:
          type: string

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 32

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenPair'

    RegisterRequest:
      type: object
      required: [user_name, email, password]
      properties:
        user_name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_\\u4e00-\\u9fa5]+$"
          example: zhangsan
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 32

    DepositRequest:
      type: object
      required: [amount, idempotency_key]
      properties:
        amount:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          description: 充值金额，必须大于 0
        idempotency_key:
          type: string
          description: 幂等键，防止重复充值

    CreateProductRequest:
      type: object
      required: [name, description, price, status, stock]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 3000
        price:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
        status:
          type: string
          enum: [active, inactive]
        stock:
          type: integer
          minimum: 0
        shop_id:
          type: string
          format: uuid
          description: 可选，关联的店铺 ID

    CreateShopRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 128
        description:
          type: string
          maxLength: 500

    ShopItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        owner_id:
          type: string
          format: uuid

    ShopResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ShopItem'

    ShopListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                shops:
                  type: array
                  items:
                    $ref: '#/components/schemas/ShopItem'
                total:
                  type: integer

    UpdateProductPropertyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 3000
        price:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true

    UpdateProductStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]

    ProductItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publisher:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: number
          format: float
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductItem'
        - type: object
          properties:
            description:
              type: string

    ProductListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                products:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProductItem'
                total:
                  type: integer

    ProductDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ProductDetail'

    CreateOrderRequest:
      type: object
      required: [product_id, quantity, idempotency_key]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        coupon_id:
          type: string
          format: uuid
          description: 可选，要使用的用户优惠券 ID
        idempotency_key:
          type: string

    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
          description: 买家账号 ID
        seller_id:
          type: string
          format: uuid
          description: 商家账号 ID，下单时从商品记录获取
        product_id:
          type: string
          format: uuid
        snapshot_title:
          type: string
        quantity:
          type: integer
        snapshot_price:
          type: number
          format: float
        discount_amount:
          type: number
          format: float
          description: 优惠券抵扣金额
        payable_amount:
          type: number
          format: float
          description: 下单时确定并保存的应付金额，最低为 0
        total_amount:
          type: number
          format: float
          description: 兼容字段，与 payable_amount 相同
        payment_deadline:
          type: string
          format: date-time
          description: 支付截止时间，下单时确定，重复下单不延长
        paid_at:
          type: string
          format: date-time
          nullable: true
          description: 支付成功时间，未支付时为 null
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: 订单关闭时间，未关闭时为 null
        close_reason:
          type: string
          nullable: true
          enum: [payment_timeout]
          description: 关闭原因码，仅超时关闭时写入
        status:
          type: integer
          description: "0=处理中 1=已完成 2=已取消 3=超时 4=已支付"
        created_at:
          type: string
          format: date-time

    OrderListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                orders:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
                total:
                  type: integer

    OrderDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/OrderItem'
                - type: object
                  properties:
                    refund:
                      $ref: '#/components/schemas/RefundDetail'
                    coupon_id:
                      type: string
                      format: uuid
                      description: 使用的用户优惠券 ID；未使用优惠券时省略
                    updated_at:
                      type: string
                      format: date-time

    RefundDetail:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, succeeded, failed, confirming]
        amount:
          type: number
          format: float
        failure_reason:
          type: string
          description: 退款明确失败时的原因
        updated_at:
          type: string
          format: date-time

    RefundResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RefundDetail'

    ApplyRefundRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key:
          type: string
          maxLength: 64
          description: 退款申请幂等键

    # === 优惠券 ===

    CreateTemplateRequest:
      type: object
      required: [name, type, total_qty, start_time, end_time]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum: [fixed_amount, percentage]
        discount_value:
          type: number
          format: float
          minimum: 0
          description: 满减金额（type=fixed_amount 时填写）
        discount_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 折扣率（type=percentage 时填写，如 0.8 表示八折）
        max_deduction:
          type: number
          format: float
          minimum: 0
          description: 折扣封顶金额（type=percentage 时可用）
        min_amount:
          type: number
          format: float
          minimum: 0
          description: 最低消费金额
        total_qty:
          type: integer
          minimum: 1
        per_user_limit:
          type: integer
          minimum: 1
          default: 1
        start_time:
          type: string
          format: date-time
          example: "2026-06-01 00:00:00"
        end_time:
          type: string
          format: date-time
          example: "2026-06-30 23:59:59"

    TemplateItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        discount_value:
          type: number
        discount_rate:
          type: number
        max_deduction:
          type: number
        min_amount:
          type: number
        total_qty:
          type: integer
        remaining_qty:
          type: integer
        per_user_limit:
          type: integer
        start_time:
          type: string
        end_time:
          type: string
        status:
          type: string
        created_at:
          type: string

    TemplateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TemplateItem'

    GrantCouponRequest:
      type: object
      required: [template_id, user_id]
      properties:
        template_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid

    UserCouponItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        template_name:
          type: string
        type:
          type: string
        discount_value:
          type: number
        discount_rate:
          type: number
        max_deduction:
          type: number
        min_amount:
          type: number
        status:
          type: string
          enum: [unused, used, expired]
        expire_time:
          type: string
        created_at:
          type: string

    UserCouponResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
