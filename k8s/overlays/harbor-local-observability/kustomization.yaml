apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../observability
  - grafana-loki-datasource.yaml
  - grafana-ecommerce-logs-dashboard.yaml

images:
  - name: grafana/loki
    newName: harbor.internal/dockerhub/grafana/loki
    newTag: 3.6.4
  - name: grafana/grafana
    newName: harbor.internal/dockerhub/grafana/grafana
    newTag: 12.3.2
  - name: grafana/alloy
    newName: harbor.internal/dockerhub/grafana/alloy
    newTag: v1.8.3
