apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecommerce-ci
  namespace: ecommerce
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecommerce-ci
  namespace: ecommerce
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["ecommerce-api"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecommerce-ci
  namespace: ecommerce
subjects:
  - kind: ServiceAccount
    name: ecommerce-ci
    namespace: ecommerce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecommerce-ci
---
# Controller supplies token data; never commit the populated Secret.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-ci-token
  namespace: ecommerce
  annotations:
    kubernetes.io/service-account.name: ecommerce-ci
type: kubernetes.io/service-account-token
