# ⚠️ 这是【模板】，里面的值是占位符。用法见 k8s/app/secret.yaml 顶部说明。
#
# 注意：改这个值要同步执行 rabbitmqctl change_password 并 restart。
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: ecommerce
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "ecommerce"
  RABBITMQ_DEFAULT_PASS: "replace-with-a-strong-password"
