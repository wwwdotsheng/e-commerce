apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce
data:
  config.yaml: |
    app:
      name: "ecommerce-api"
      port: 8080
      env: "dev"
      ssl: false

    database:
      host: "postgres"
      port: 5432
      user: "postgres"
      password: "postgres"
      db_name: "ecommerce"
      ssl_mode: disable
      max_idle_conns: 10
      max_open_conns: 50
      conn_max_lifetime: 10
      time_zone: "Asia/Shanghai"
      log_level: "warn"

    redis:
      host: "redis"
      port: 6379
      password: ""
      db: 0
      pool_size: 10

    rabbitmq:
      user: "guest"
      password: "guest"
      host: "rabbitmq"
      port: 5672

    registry:
      prefix: "harbor.internal/dockerhub/"

    log:
      console_level: "info"
      file_level: "info"
      filename: "/app/logs/app.log"
      max_size: 100
      max_backups: 3
      max_age: 28

    auth:
      access_token_expire: 15m
      refresh_token_expire: 168h
      token_secret: "12345678"

    otel:
      enabled: false
      endpoint:
        trace_endpoint: "tempo:4317"
        metric_endpoint: "prometheus:9090"
      service_name: "e-commerce"

    elasticsearch:
      host: "elasticsearch"
      port: 9200

    order_mq:
      exchange: "dlx_exchange"
      consumer_queue: "order_timeout_queue"
      delay_queue: "order_delay_queue"
      routing_key: "timeout"
      ttl_ms: 30000
