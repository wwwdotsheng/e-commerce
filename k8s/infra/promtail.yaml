apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netchecker
spec:
  selector:
    matchLabels:
      app: netchecker
  template:
    metadata:
      labels:
        app: netchecker
    spec:
      containers:
        - name: busybox
          image: grafana/promtail:3.6.4
          args:
            - /bin/sh
            - -c
            - 'while true; do ping -c 4 8.8.8.8; sleep 60; done'