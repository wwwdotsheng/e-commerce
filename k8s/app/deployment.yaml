apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api
  namespace: ecommerce
  labels:
    app: ecommerce-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-api
  template:
    metadata:
      labels:
        app: ecommerce-api
    spec:
      containers:
        - name: api
          image: docker.io/library/ecommerce-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/main"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/app
              readOnly: true
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: APP_APP_ENV
              value: "DEV"
            - name: APP_AUTH_TOKEN_SECRET
              value: "this-is-a-strong-secret-for-dev-2024"
            - name: CONFIG_PATH
              value: "/etc/app/config.yaml"
      volumes:
        - name: config
          configMap:
            name: app-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: logs
          emptyDir: {}
