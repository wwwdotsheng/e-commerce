apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api
  namespace: ecommerce
  labels:
    app: ecommerce-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-api
  template:
    metadata:
      labels:
        app: ecommerce-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ecommerce-api
          image: e-commerce:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Kubernetes receives individual settings from ConfigMap and Secret.
          # An explicitly empty CONFIG_PATH selects ENV-only configuration.
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            # 显式指定进程时区，避免行为依赖基础镜像的默认值；
            # 无时区输入按 APP_APP_BUSINESS_TIME_ZONE 解释。
            - name: TZ
              value: "Asia/Shanghai"
            - name: CONFIG_PATH
              value: ""
            - name: APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: APP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: APP_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
            - name: APP_AUTH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-app-secret
                  key: AUTH_TOKEN_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
