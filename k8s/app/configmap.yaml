apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  config.yaml: |
    app:
      name: "ecommerce-api"
      port: 8080
      ssl: false
      ssl_crt_path: ""
      ssl_key_path: ""
      # 两个排查用的开关，集群里保持关闭：
      # 打开会把密码打进日志 / 把原始错误返给客户端
      print_config: false
      expose_dev_msg: false

    database:
      host: "postgres"
      port: 5432
      user: "postgres"
      password: ""
      db_name: "ecommerce"
      ssl_mode: "disable"
      max_idle_conns: 20
      max_open_conns: 50
      conn_max_lifetime: 10
      time_zone: "Asia/Shanghai"
      log_level: "info"
      # schema 变更走 migrations/，不靠启动时自动建表
      auto_migrate: false

    redis:
      host: "redis"
      port: 6379
      password: ""
      db: 0
      pool_size: 10

    rabbitmq:
      host: "rabbitmq"
      port: 5672
      user: "ecommerce"
      password: ""

    registry:
      prefix: ""

    log:
      console_level: "info"
      file_level: ""
      filename: ""
      max_size: 100
      max_backups: 3
      max_age: 28

    auth:
      access_token_expire: 15m
      refresh_token_expire: 168h
      token_secret: ""

    otel:
      enabled: false
      endpoint:
        trace_endpoint: "tempo:4317"
        metric_endpoint: "prometheus:9090"
      service_name: "e-commerce"

    elasticsearch:
      host: "elasticsearch"
      port: 9200

    order_mq:
      exchange: "dlx_exchange"
      consumer_queue: "order_timeout_queue"
      delay_queue: "order_delay_queue"
      routing_key: "timeout"
      ttl_ms: 30000
