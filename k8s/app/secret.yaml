# ⚠️ 这是【模板】，里面的值是占位符。
#
# 真实值不放这里，也不提交进 Git。用法：
#   1. 复制一份：cp k8s/app/secret.yaml k8s/app/secret.local.yaml
#   2. 把 secret.local.yaml 里的值换成真的（secret.local.yaml 已在 .gitignore）
#   3. 应用：kubectl apply -f k8s/app/secret.local.yaml
#      或者跑 scripts/apply-secrets.sh 一次应用全部
#
# ★ 这个文件【没有】被 kustomization.yaml 引用，所以
#   kubectl apply -k 不会碰它 —— 集群里的真值不会被占位符覆盖。
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-app-secret
  namespace: ecommerce
type: Opaque
stringData:
  # JWT 签名密钥。生成方式：openssl rand -base64 48 | tr -d '\n'
  AUTH_TOKEN_SECRET: "replace-with-a-random-value"
