apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    local.file_match "pod_logs" {
      path_targets = [
        {
          "__path__" = "/var/log/pods/*/*/*.log",
          "job"      = "kubernetes-pods",
        },
      ]
    }

    loki.source.file "pod_logs" {
      targets       = local.file_match.pod_logs.targets
      forward_to    = [loki.process.pod_logs.receiver]
      tail_from_end = true
    }

    loki.process "pod_logs" {
      stage.cri {}

      // The file path is:
      // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log
      // These are stable, low-cardinality Kubernetes dimensions.
      stage.regex {
        source     = "filename"
        expression = "^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/[0-9]+\\.log$"
      }

      stage.labels {
        values = {
          namespace = "namespace",
          pod       = "pod",
          container = "container",
        }
      }

      // Application logs are JSON. Infrastructure logs may remain plain text;
      // those entries simply have no level label and are shown as unknown.
      stage.json {
        expressions = {
          level    = "level",
          log_type = "log_type",
        }
      }

      stage.labels {
        values = {
          level    = "level",
          log_type = "log_type",
        }
      }

      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
