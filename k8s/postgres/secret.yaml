# ⚠️ 这是【模板】，里面的值是占位符。用法见 k8s/app/secret.yaml 顶部说明。
#
# 注意：PostgreSQL 的密码在 initdb 时写进数据目录。
#       改这里的值不会改数据库里的密码 —— 必须同时执行
#         ALTER USER postgres WITH PASSWORD '<新值>';
#       否则应用用新密码连不上旧密码的库。
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "replace-with-a-strong-password"
  POSTGRES_DB: "ecommerce"
