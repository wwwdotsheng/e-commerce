services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        REGISTRY_PREFIX: ${BUILD_REGISTRY_PREFIX:-${IMAGE_REPOSITORY:-}}
    restart: always
    volumes:
    - ./configs/config.yaml:/app/configs/config.yaml:ro
    - ./logs:/app/logs
    ports:
    - ${APP_HTTP_PORT:-10000}:${APP_APP_PORT:-8080}
    networks:
    - monitor_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command:
    - ./main
    environment:
      # 进程时区显式指定，避免依赖基础镜像默认值。
      TZ: Asia/Shanghai
      CONFIG_PATH: /app/configs/config.yaml
      APP_APP_GIN_MODE: ${APP_APP_GIN_MODE:-release}
      APP_APP_BUSINESS_TIME_ZONE: ${APP_APP_BUSINESS_TIME_ZONE:-Asia/Shanghai}
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
      APP_RABBITMQ_HOST: rabbitmq
      APP_RABBITMQ_USER: ${APP_RABBITMQ_USER:-ecommerce}
      APP_RABBITMQ_PASSWORD: ${APP_RABBITMQ_PASSWORD:?Set APP_RABBITMQ_PASSWORD}
      APP_REDIS_HOST: redis
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-}
      APP_AUTH_TOKEN_SECRET: ${APP_AUTH_TOKEN_SECRET:?Set APP_AUTH_TOKEN_SECRET}
      APP_APP_PRINT_CONFIG: ${APP_APP_PRINT_CONFIG:-false}
      APP_APP_EXPOSE_DEV_MSG: ${APP_APP_EXPOSE_DEV_MSG:-false}
      APP_OTEL_ENABLED: ${APP_OTEL_ENABLED:-false}
      APP_OTEL_ENDPOINT_TRACE_ENDPOINT: tempo:4317
      APP_OTEL_ENDPOINT_METRIC_ENDPOINT: prometheus:9090
      APP_ELASTICSEARCH_ENABLED: ${APP_ELASTICSEARCH_ENABLED:-false}
      APP_ELASTICSEARCH_HOST: elasticsearch
      APP_LOG_CONSOLE_LEVEL: ${APP_LOG_CONSOLE_LEVEL:-info}
      APP_LOG_FILE_LEVEL: ${APP_LOG_FILE_LEVEL:-}
      APP_LOG_FILENAME: ${APP_LOG_FILENAME:-}
      APP_ORDER_MQ_TTL_MS: ${APP_ORDER_MQ_TTL_MS:-30000}
      APP_APP_PORT: ${APP_APP_PORT:-8080}
      APP_DATABASE_PORT: '5432'
      APP_DATABASE_USER: ${APP_DATABASE_USER:-postgres}
      APP_DATABASE_DB_NAME: ${APP_DATABASE_DB_NAME:-ecommerce}
      APP_REDIS_PORT: '6379'
      APP_RABBITMQ_PORT: '5672'
    env_file:
    - path: .env
      required: false
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:${APP_APP_PORT:-8080}/ready
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 20
  postgres:
    image: ${IMAGE_REPOSITORY:-}postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${APP_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
      POSTGRES_DB: ${APP_DATABASE_DB_NAME:-ecommerce}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
    - ${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - monitor_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: ${IMAGE_REPOSITORY:-}redis:7-alpine
    restart: always
    ports:
    - ${REDIS_PORT:-6379}:6379
    volumes:
    - redis_data:/data
    networks:
    - monitor_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    environment:
      REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-}
    command:
    - sh
    - -ec
    - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test:
      - CMD-SHELL
      - if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli
        ping; else redis-cli ping; fi
      interval: 3s
      timeout: 3s
      retries: 20
  elasticsearch:
    image: ${IMAGE_REPOSITORY:-}elasticsearch:8.17.3
    restart: always
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
    - 9200:9200
    volumes:
    - es_data:/usr/share/elasticsearch/data
    networks:
    - monitor_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    profiles:
    - search
  rabbitmq:
    image: ${IMAGE_REPOSITORY:-}rabbitmq:3-alpine
    restart: always
    ports:
    - ${RABBITMQ_PORT:-5672}:5672
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${APP_RABBITMQ_USER:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${APP_RABBITMQ_PASSWORD:?Set APP_RABBITMQ_PASSWORD}
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener
        5672
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
    - monitor_net
  prometheus:
    image: ${IMAGE_REPOSITORY:-}prom/prometheus:v3.9.1
    restart: always
    ports:
    - 9090:9090
    volumes:
    - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --web.enable-otlp-receiver
    networks:
    - monitor_net
    profiles:
    - observability
  tempo:
    image: ${IMAGE_REPOSITORY:-}grafana/tempo:2.10.0
    restart: always
    command:
    - -config.file=/etc/tempo.yaml
    volumes:
    - ./configs/tempo.yaml:/etc/tempo.yaml
    ports:
    - 4317:4317
    - 4318:4318
    - 3200:3200
    networks:
    - monitor_net
    profiles:
    - observability
  loki:
    image: ${IMAGE_REPOSITORY:-}grafana/loki:3.6.4
    restart: always
    ports:
    - 3100:3100
    volumes:
    - ./configs/loki-config.yaml:/etc/loki/local-config.yaml
    - ./data/loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
    - monitor_net
    profiles:
    - observability
  promtail:
    image: ${IMAGE_REPOSITORY:-}grafana/promtail:3.6.4
    restart: always
    volumes:
    - ./logs:/var/log
    - ./configs/promtail-config.yaml:/etc/promtail/config.yaml
    - ./data/promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yaml
    networks:
    - monitor_net
    profiles:
    - observability
  grafana:
    image: ${IMAGE_REPOSITORY:-}grafana/grafana:12.3.2
    restart: always
    ports:
    - 3000:3000
    environment:
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
    - ./data/grafana:/var/lib/grafana
    networks:
    - monitor_net
    profiles:
    - observability
networks:
  monitor_net:
    driver: bridge
volumes:
  postgres_data: {}
  redis_data: {}
  rabbitmq_data: {}
  es_data: {}
