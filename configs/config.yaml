# One schema for direct execution, Compose and Kubernetes.
# Secrets are supplied by APP_* variables; this file contains no credentials.
app:
  name: ecommerce-api
  port: 8080
  gin_mode: release
  ssl: false
  ssl_crt_path: ""
  ssl_key_path: ""
  print_config: false
  expose_dev_msg: false

database:
  host: localhost
  port: 5432
  user: postgres
  password: ""
  db_name: ecommerce
  ssl_mode: disable
  max_idle_conns: 20
  max_open_conns: 50
  conn_max_lifetime: 10
  time_zone: Asia/Shanghai
  log_level: info
  auto_migrate: false

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10

rabbitmq:
  host: localhost
  port: 5672
  user: ecommerce
  password: ""

registry:
  prefix: ""

log:
  console_level: info
  file_level: ""
  filename: ""
  max_size: 100
  max_backups: 3
  max_age: 28

auth:
  access_token_expire: 15m
  refresh_token_expire: 168h
  token_secret: ""

otel:
  enabled: false
  endpoint:
    trace_endpoint: ""
    metric_endpoint: ""
  service_name: e-commerce

elasticsearch:
  enabled: false
  host: localhost
  port: 9200

# Preserve the existing timeout. Values here are milliseconds.
# Changing an existing RabbitMQ queue TTL requires a queue migration.
order_mq:
  exchange: dlx_exchange
  consumer_queue: order_timeout_queue
  delay_queue: order_delay_queue
  routing_key: timeout
  ttl_ms: 30000
