app:
  name: "ecommerce-api"
  port: 8080
  ssl: false
  ssl_crt_path: ""
  ssl_key_path: ""
  # 以下两个开关默认取「安全的那一侧」，要用环境变量显式打开：
  #   APP_APP_PRINT_CONFIG=true    启动时把完整配置打进日志（含密码，仅排查用）
  #   APP_APP_EXPOSE_DEV_MSG=true  响应里带 devMsg（含原始错误，仅排查用）
  print_config: false
  expose_dev_msg: false

database:
  host: "postgres-dev"
  port: 5432
  user: "postgres"
  password: "postgres"
  db_name: "postgres"
  ssl_mode: disable
  max_idle_conns: 100
  max_open_conns: 100
  conn_max_lifetime: 10
  time_zone: "Asia/Shanghai"
  log_level: "info"
  # schema 变更走 migrations/，不靠启动时自动建表。
  # 本地开发用 APP_DATABASE_AUTO_MIGRATE=true 打开。
  auto_migrate: false

redis:
  host: "redis"
  port: 6379
  password:
  db: 0
  pool_size: 10

rabbitmq:
  user: "guest"
  password: "guest"
  host: "rabbitmq"
  port: 5672

registry:
  # 镜像仓库前缀，留空 = Docker Hub。CI 里用 APP_REGISTRY_PREFIX 覆盖
  prefix: ""

log:
  console_level: "debug"
  file_level: "debug"
  filename: "./logs/app.log"
  max_size: 100
  max_backups: 3
  max_age: 28

auth:
  access_token_expire: 15m
  refresh_token_expire: 168h
  # 不在这里放默认值 —— Validate() 会拒绝空值和示例值。
  # 各环境用 APP_AUTH_TOKEN_SECRET 提供：
  #   本地开发  放 .env（代码里 godotenv.Load() 会读）
  #   集群部署  来自 Secret
  #   测试/CI   由 CI 变量注入
  # 生成：openssl rand -base64 48 | tr -d '\n'
  token_secret: ""

otel:
  enabled: true
  endpoint:
    trace_endpoint: "tempo:4317"
    metric_endpoint: "prometheus:9090"
  service_name: "e-commerce"

test_images:
  postgres: "postgres:15-alpine"
  redis: "redis:7-alpine"
  rabbitmq: "rabbitmq:3-alpine"


elasticsearch:
  host: "elasticsearch"
  port: 9200

order_mq:
  exchange: "dlx_exchange"
  consumer_queue: "order_timeout_queue"
  delay_queue: "order_delay_queue"
  routing_key: "timeout"
  ttl_ms: 30000